<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
    <link rel="stylesheet" href="evento.css">
</head>
<body>

    <header class="header">
        <div class="menu container">
            <a href="index.html" class="logo">Bar Central</a>
            <input type="checkbox" id="menu">
            <label for="menu">
                <img src="images/menu.png" class="menu-icono" alt="Menu">
            </label>

            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Starter</a></li>
                    <li><a href="us.html">Us</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="reservations.html">Reservations</a></li>
                    <li><a href="dresscode.html">Dress Code</a></li>
                    <li><a href="#">FAQ's</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>

            <div class="icons">
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-tiktok"></i>
            </div>
        </div>

        <div class="header-txt">
            <h1>
                The best events in the best place.
            </h1>
            <p>
                Come and enjoy the best events and top DJs at our venue;
                experience something unforgettable—just for you.
            </p>
            <a href="#" class="btn-1">Reservations</a>
        </div>
    </header>


    <section class="adventure container">
        <span>Upcoming</span>
        <h2>Events</h2>
        <div class="slider"
            style="
                --width: 250px;
                --height: 300px;
                --quantity: 9;
            ">

            <div class="list">
                <div class="item" style="--position: 1;">
                    <div class="card">
                        <img src="images/tomorrowland.jpeg" alt="Tomorrowland">
                    </div>
                </div>

                <div class="item" style="--position: 2;">
                    <div class="card">
                        <img src="images/ultra.jpeg" alt="Ultra Music Festival">
                    </div>
                </div>

                <div class="item" style="--position: 3;">
                    <div class="card">
                        <img src="images/calvin.jpeg" alt="Calvin Harris">
                    </div>
                </div>

                <div class="item" style="--position: 4;">
                    <div class="card">
                        <img src="images/sonny.jpeg" alt="Sonny">
                    </div>
                </div>

                <div class="item" style="--position: 5;">
                    <div class="card">
                        <img src="images/no.jpeg" alt="Event 5">
                    </div>
                </div>

                <div class="item" style="--position: 6;">
                    <div class="card">
                        <img src="images/sub.jpeg" alt="Event 6">
                    </div>
                </div>

                <div class="item" style="--position: 7;">
                    <div class="card">
                        <img src="images/si.jpeg" alt="Event 7">
                    </div>
                </div>

                <div class="item" style="--position: 8;">
                    <div class="card">
                        <img src="images/globo.jpeg" alt="Event 8">
                    </div>
                </div>

                <div class="item" style="--position: 9;">
                    <div class="card">
                        <img src="images/ind.jpeg" alt="Event 9">
                    </div>
                </div>
            </div>
        </div>

    </section>


    <footer class="footer">
        <div class="footer-content container">
            <a href="index.html">Inicio</a>
            <a href="us.html">Nosotros</a>
            <a href="#">Contacto</a>
        </div>
    </footer>


</body>
</html>
